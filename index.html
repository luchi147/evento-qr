<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gracias por acompañarnos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: 'Montserrat', sans-serif;
      color: #3d3027;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
      background:
        linear-gradient(rgba(246, 240, 232, 0.72), rgba(246, 240, 232, 0.72)),
        url(foto/foto1.jpg) center center / cover no-repeat;
    }

    /* capa decorativa suave */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(255,255,255,0.20) 0%,
        rgba(191,167,138,0.08) 100%
      );
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
    }

    .card {
      width: 100%;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(191, 167, 138, 0.35);
      border-radius: 28px;
      padding: 34px 24px;
      text-align: center;
      box-shadow: 0 18px 45px rgba(88, 67, 49, 0.14);
      animation: fadeUp 0.8s ease;
    }

    .ornament {
      font-size: 1.3rem;
      color: #b08b63;
      margin-bottom: 10px;
      letter-spacing: 4px;
    }

    .line {
      width: 72px;
      height: 1px;
      background: #bfa78a;
      margin: 0 auto 20px;
      opacity: 0.8;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem;
      line-height: 1.1;
      font-weight: 600;
      color: #2f241d;
      margin-bottom: 14px;
    }

    p {
      font-size: 0.96rem;
      line-height: 1.7;
      color: #5b4c40;
      margin-bottom: 28px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 52px;
      padding: 14px 18px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.3px;
      transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease, border 0.25s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-instagram {
      background: #3d3027;
      color: #fffaf6;
      border: 1px solid #3d3027;
    }

    .btn-instagram:hover {
      background: #2d221c;
    }

    .btn-review {
      background: rgba(255,255,255,0.35);
      color: #3d3027;
      border: 1px solid #bfa78a;
    }

    .btn-review:hover {
      background: #f3e9df;
    }

    .footer {
      margin-top: 24px;
      font-size: 0.82rem;
      color: #7d6958;
      line-height: 1.5;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Ajustes para celulares chicos */
    @media (max-width: 480px) {
      body {
        padding: 16px;
        background:
          linear-gradient(rgba(246, 240, 232, 0.76), rgba(246, 240, 232, 0.76)),
          url(foto/foto1.jpg) center center / cover no-repeat;
      }

      .card {
        border-radius: 24px;
        padding: 28px 20px;
      }

      h1 {
        font-size: 1.95rem;
      }

      p {
        font-size: 0.92rem;
      }

      .btn {
        min-height: 50px;
        font-size: 0.92rem;
      }
    }

    /* Para pantallas un poco más grandes */
    @media (min-width: 768px) {
      .container {
        max-width: 460px;
      }

      .card {
        padding: 40px 28px;
      }

      h1 {
        font-size: 2.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="ornament">✦ ✦ ✦</div>
      <div class="line"></div>

      <h1>Gracias por acompañarnos</h1>

      <p>
        Desde Ohana eventos nos encantaría que seas parte de nuestra comunidad y que compartas tu experiencia con nosotros.
      </p>

      <div class="buttons">
        <a href="https://www.instagram.com/salon.ohana.eventos?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw=" class="btn btn-instagram" target="_blank">
          Seguir en Instagram
        </a>

        <a href="https://maps.app.goo.gl/KnQekkpQmdqB6mhE7" class="btn btn-review" target="_blank">
          Dejar una reseña
        </a>
      </div>

      <div class="footer">
        Gracias por ser parte de este momento especial
      </div>
    </div>
  </div>
</body>
</html>
